spring:
  datasource:
    url: jdbc:h2:mem:conmon-fixed;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

conmon:
  configuration:
    replace-existing: true
    read-only: true
